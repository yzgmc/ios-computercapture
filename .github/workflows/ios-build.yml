name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      # 真机平台可能未预装，必须下载成功。新 VM 上 -downloadPlatform 偶发
      # "Unable to connect to simulator"（CoreSimulator 服务未就绪）：
      # 先跑一次 simctl 唤醒服务，再带 3 次重试
      - name: Install iOS platform
        run: |
          xcrun simctl list devices >/dev/null 2>&1 || true
          for i in 1 2 3; do
            echo "Attempt $i: downloading iOS platform..."
            if xcodebuild -downloadPlatform iOS; then
              echo "iOS platform installed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 20s..."
            sleep 20
          done
          echo "::error::Failed to download iOS platform after 3 attempts"
          exit 1

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # 无签名真机构建（Apple 签名资料过期，产物 ipa 需用户自行签名安装，
      # 例如 Sideloadly / AltStore / TrollStore）
      - name: Build iOS app (unsigned, device)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project PhoneCam.xcodeproj \
            -scheme PhoneCam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR=$PWD/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify --renderer github-actions

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/PhoneCam.app Payload/
          zip -qry PhoneCam-unsigned.ipa Payload
          ls -lh PhoneCam-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneCam-unsigned-ipa
          path: ios/PhoneCam-unsigned.ipa
          if-no-files-found: error
