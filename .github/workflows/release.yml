name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package signaling server + web client
        run: |
          mkdir -p signaling-server/signaling
          cp -r signaling/*.py signaling/requirements.txt signaling-server/signaling/
          cp -r web signaling-server/web
          cd signaling-server
          zip -r ../signaling-server.zip .

      - name: Package web client only
        run: |
          zip -r web-client.zip web

      - name: Package desktop client
        run: |
          cd desktop
          zip -r ../desktop-client.zip .

      - name: Upload server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-artifacts
          path: |
            signaling-server.zip
            web-client.zip
            desktop-client.zip
          if-no-files-found: error

  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Install iOS platform
        run: |
          sudo xcodebuild -runFirstLaunch
          # 有时下载会失败，重试最多 3 次
          for i in {1..3}; do
            echo "Attempt $i to download iOS platform..."
            sudo xcodebuild -downloadPlatform iOS && break
            sleep 10
          done
          xcodebuild -showsdks | grep iphoneos

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          gem install cocoapods
          pod install --repo-update

      - name: Check Pods signing settings
        working-directory: ios
        run: |
          xcodebuild -showBuildSettings \
            -workspace PhoneCam.xcworkspace \
            -scheme PhoneCam \
            -sdk iphoneos \
            -target Pods-PhoneCam \
            | grep -E 'CODE_SIGN|PROVISIONING_PROFILE|DEVELOPMENT_TEAM' || true

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          CERTIFICATE_NAME=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -o '".*"' | head -1 | tr -d '"')
          echo "CERTIFICATE_NAME=$CERTIFICATE_NAME" >> $GITHUB_ENV
          echo "Installed certificate: $CERTIFICATE_NAME"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)
          mv "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "Installed provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Build and archive iOS app
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild clean archive \
            -workspace PhoneCam.xcworkspace \
            -scheme PhoneCam \
            -sdk iphoneos \
            -archivePath $PWD/build/PhoneCam.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER=com.yzg.phonecam \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            | xcbeautify --renderer github-actions

      - name: Generate export options
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>debugging</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.yzg.phonecam</key>
                  <string>$PROFILE_UUID</string>
              </dict>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>thinning</key>
              <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath $PWD/build/PhoneCam.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $PWD/build

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: ios/build/*.ipa
          if-no-files-found: error

  release:
    needs: [build-server, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download server artifacts
        uses: actions/download-artifact@v4
        with:
          name: server-artifacts
          path: artifacts

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-artifacts
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.${{ github.run_number }}
          name: PhoneCam v0.0.${{ github.run_number }}
          files: artifacts/*
          generate_release_notes: true
          make_latest: true
